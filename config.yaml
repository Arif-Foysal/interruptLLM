# interruptllm pipeline configuration.
# Edit before running. The pipeline.py CLI reads this on every command.

project:
  slug: "interruptllm" # kebab-case; used as kernel/dataset prefix

kaggle:
  username: "mdzero591"
  # Datasets referenced by notebooks. The 'core' entry is created/updated by
  # `pipeline.py upload-src`. Phase-result entries are created by
  # `pipeline.py upload-results <phase>`. Add public dataset slugs as needed.
  datasets:
    core: "mdzero591/interruptllm-core"
    raw_data: "bektursyn/llm-inference-logs-and-performance-metrics"
    # Intermediate results, populated as phases complete:
    # phase1_results: "mdzero591/interruptllm-phase1-results"
    # phase2_results: "mdzero591/interruptllm-phase2-results"

  # Optional extra files bundled into the core dataset alongside src/*.py.
  # Useful for fixed inputs like train/val splits that all notebooks should see.
  core_extras: []
  # core_extras: ["results/splits_v1.json"]

# Pipeline control
pipeline:
  phases:
    phase1:
      description: "Synthetic / smoke validation"
      notebooks:
        - id: "phase1a"
          title: "Smoke test and pipeline validation"
          gpu: false
          timeout_hours: 3
          datasets: [] # core is always included; list extras here
          success_criteria:
            - "experiment_complete == true"

    phase2:
      description: "MLFQ scheduler simulation"
      notebooks:
        - id: "phase2a"
          title: "MLFQ scheduler with real workload trace"
          gpu: false
          timeout_hours: 3
          datasets: ["raw_data"]
          success_criteria:
            - "simulation_complete == true"

    phase3:
      description: "Context swap microbenchmark"
      notebooks:
        - id: "phase3a"
          title: "GPU-CPU-SSD context swap latency benchmark"
          gpu: false
          timeout_hours: 3
          datasets: []
          success_criteria:
            - "benchmark_complete == true"

    phase4:
      description: "End-to-end evaluation"
      notebooks:
        - id: "phase4a"
          title: "End-to-end latency and fairness evaluation"
          gpu: false
          timeout_hours: 3
          datasets: ["raw_data"]
          success_criteria:
            - "evaluation_complete == true"

    phase5:
      description: "Real GPU swap latency benchmark"
      notebooks:
        - id: "phase5a"
          title: "GPU→CPU memcpy benchmark on P100"
          gpu: true
          timeout_hours: 2
          datasets: []
          success_criteria:
            - "benchmark_complete == true"

  max_retries_per_notebook: 5
  poll_interval_seconds: 120
  auto_advance: false
